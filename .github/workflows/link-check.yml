name: Link Check

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "content/**/*.md"
      - "reference/**/*.md"
      - ".github/**/*.md"
      - ".github/**/*.yml"
      - ".lychee.toml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "content/**/*.md"
      - "reference/**/*.md"
      - ".github/**/*.md"
      - ".github/**/*.yml"
      - ".lychee.toml"
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --verbose --no-progress README.md CONTRIBUTING.md content reference .github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
