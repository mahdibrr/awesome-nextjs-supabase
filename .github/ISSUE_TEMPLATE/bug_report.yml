name: Bug report
description: Report a broken link, a wrong entry, or a factual error in an existing resource.
title: "Bug: "
labels:
  - bug
body:
  - type: dropdown
    id: kind
    attributes:
      label: What is broken?
      description: Pick the closest match.
      options:
        - Broken link (404, redirect to spam, gated page)
        - Wrong or outdated information in a resource description
        - Duplicate of another resource on the list
        - Off-topic resource (does not match its section)
        - Other
    validations:
      required: true
  - type: input
    id: resource
    attributes:
      label: Affected resource
      description: Title and URL of the resource that has the problem.
      placeholder: |
        Title: Stripe Webhooks
        URL: https://docs.stripe.com/webhooks
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: What is wrong?
      description: A short, factual description. Include the expected vs actual state.
    validations:
      required: true
  - type: input
    id: replacement
    attributes:
      label: Suggested replacement (optional)
      description: If you have a working alternative link, paste it here. Leave empty if you do not.
      placeholder: https://docs.stripe.com/webhooks
    validations:
      required: false
