name: Resource request
description: Suggest a resource for the list.
title: "Add resource: "
labels:
  - resource
body:
  - type: input
    id: url
    attributes:
      label: Resource URL
      description: Link to the resource you want to add.
      placeholder: https://www.iloveblogs.blog/guides/building-saas-nextjs-supabase
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Resource title
      description: The title that should appear in the README.
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Best section
      options:
        - Core Guides
        - Next.js App Router
        - Supabase Auth & Security
        - Database, RLS & Postgres
        - SaaS Architecture
        - Stripe & Billing
        - Realtime Apps
        - Performance & Caching
        - AI, pgvector & RAG
        - Testing, CI/CD & Deployment
        - Production Fixes
        - Comparisons & Decision Guides
        - Official References
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why should this be included?
      description: Explain the practical value for production Next.js and Supabase developers.
    validations:
      required: true
